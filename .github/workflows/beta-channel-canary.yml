name: Beta channel canary

# The desktop updater's noise filter suppresses exactly the 404s that would
# reveal a broken staging-rolling release in Sentry, so nothing else watches
# this endpoint. A red run here means beta users cannot update.
#
# The platform checks matter because the app treats a manifest with no entry for
# its platform as "no update" instead of an error (classify_update_check in
# lib.rs), so a manifest that lost windows-x86_64 strands those installs
# silently. Both release workflows publish latest.json only once every platform
# has built, so an in-flight release does not red this run.
#
# linux-x86_64 is deliberately not asserted: it ships on the rc channel only, so
# a stable release drops it from staging-rolling until the next rc.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

jobs:
  check-updater-endpoints:
    runs-on: ubuntu-latest
    steps:
      - name: staging-rolling latest.json answers 200 with a version
        run: |
          set -euo pipefail
          url="https://github.com/${{ github.repository }}/releases/download/staging-rolling/latest.json"
          body=$(curl -sfL --max-time 30 "$url")
          echo "$body" | head -c 400
          echo "$body" | grep -q '"version"' || { echo "::error::latest.json has no version field"; exit 1; }
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            echo "$body" | jq -e --arg p "$platform" '.platforms[$p].url' >/dev/null \
              || { echo "::error::staging latest.json has no $platform entry"; exit 1; }
          done

      - name: stable latest.json covers every shipped platform
        run: |
          set -euo pipefail
          url="https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          body=$(curl -sfL --max-time 30 "$url")
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            echo "$body" | jq -e --arg p "$platform" '.platforms[$p].url' >/dev/null \
              || { echo "::error::stable latest.json has no $platform entry"; exit 1; }
          done
