name: Test

on:
  push:
    branches:
      - main
      - staging
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Set up Python 3.12 (runtime lock checks)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: No child process spawns a console window on Windows
        # Headroom is a GUI-subsystem binary, so any console-subsystem child
        # spawned without CREATE_NO_WINDOW gets its own visible (and blank,
        # since we pipe stdio) console. See src-tauri/src/proc.rs.
        run: ./scripts/check-no-console.sh

      - name: Locks cover every headroom-ai dependency
        # The wheel installs with --no-deps, so a dep absent from a lock is an
        # ImportError at backend start, not something pip resolves later.
        # Covers all three platform locks in one pass.
        run: |
          python -m pip install --quiet packaging
          python scripts/check-python-locks.py

      - name: Linux runtime lock resolves to wheels only
        # Mirrors the Windows job's check: a pin with no manylinux wheel makes
        # bootstrap compile from source on the user's machine. No --platform,
        # deliberately: this job already runs on Linux x86_64, and pip matches
        # --platform against wheel tags exactly rather than accepting older
        # compatible ones, so naming manylinux_2_28 rejected the manylinux_2_17
        # wheels that packages like orjson actually publish. Resolving for the
        # runner's own platform is both simpler and a truer model of a user's
        # machine. --find-links mirrors VENDOR_WHEELS_INDEX_URL in
        # tool_manager.rs, the way the Windows check does.
        run: >
          python -m pip install --dry-run --no-deps --only-binary=:all:
          --find-links https://github.com/gglucass/headroom-desktop/releases/expanded_assets/vendor-wheels-v1
          -r src-tauri/python/headroom-linux-requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run app test suite
        run: ./scripts/verify-release.sh

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Set up Python 3.12 (runtime lock check)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Windows runtime lock resolves to wheels only
        # A pin without a win_amd64/universal wheel makes bootstrap compile
        # from source, which needs MSVC and bricks every user install without
        # build tools (hnswlib, RUST-65). Fail here instead. --dry-run
        # resolves the full pin set without installing; the --find-links
        # mirror matches VENDOR_WHEELS_INDEX_URL in tool_manager.rs.
        shell: bash
        run: >
          python -m pip install --dry-run --no-deps --only-binary=:all:
          --find-links https://github.com/gglucass/headroom-desktop/releases/expanded_assets/vendor-wheels-v1
          -r src-tauri/python/headroom-windows-requirements.lock

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm run test:coverage

      - name: Run desktop tests
        shell: bash
        # --no-fail-fast: enumerate every Windows failure in one run instead of
        # one class per approve/fix round while the platform is being hardened.
        run: cargo nextest run --no-fail-fast --manifest-path src-tauri/Cargo.toml

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (runtime lock check)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: macOS arm64 runtime lock resolves to wheels only
        # Same gate as the Linux and Windows jobs, for the primary platform.
        # The macOS lock splits pins by environment marker (onnxruntime 1.27.0
        # on arm64, 1.23.2 on Intel), so this job only proves the arm64 branch
        # resolves; macos-intel-lock covers the other. No --platform: pip
        # matches wheel tags exactly rather than accepting older compatible
        # ones, so resolving for the runner's own arch is the truer model.
        run: >
          python -m pip install --dry-run --no-deps --only-binary=:all:
          --find-links https://github.com/gglucass/headroom-desktop/releases/expanded_assets/vendor-wheels-v1
          -r src-tauri/python/headroom-requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run app test suite
        # macOS is the primary platform but was previously only gated inside
        # the release workflows, so a macOS-only regression reached staging
        # green and surfaced at release cut. Gate it on PR instead.
        run: ./scripts/verify-release.sh

  macos-intel-lock:
    # Intel Macs still receive the shipped app: the release builds
    # --target universal-apple-darwin. A pin whose macOS wheels are arm64-only
    # is a bootstrap dead end for every Intel user (RUST, 2026-08-20:
    # onnxruntime resolved to a version with no x86_64 macOS wheel and the
    # install could not complete). Only Python is needed, so this stays a thin
    # job rather than a second full test matrix entry.
    # macos-15-intel is the last x86_64 image Actions offers, available until
    # roughly August 2027; macos-13 was retired in December 2025.
    runs-on: macos-15-intel
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (runtime lock check)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: macOS x86_64 runtime lock resolves to wheels only
        run: >
          python -m pip install --dry-run --no-deps --only-binary=:all:
          --find-links https://github.com/gglucass/headroom-desktop/releases/expanded_assets/vendor-wheels-v1
          -r src-tauri/python/headroom-requirements.lock
