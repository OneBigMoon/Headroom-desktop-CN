# Windows x86_64 (cp312) resolution of headroom-ai[all]==0.32.0, 2026-08-03.
# Platform-neutral pins (plain name==version lines) carried forward from the
# macOS full-stack lock; every native dependency here ships a win_amd64 cp312
# wheel (torch==2.12.1, onnxruntime, opencv-python, etc.), so the full stack
# installs on Windows. A Windows-only resolution change belongs in this file
# and never perturbs the macOS lock.
#
# hnswlib is deliberately ABSENT (unlike the macOS lock's [all,vector]):
# PyPI has no hnswlib wheel at all (sdist only), vendor-wheels-v1 carries no
# win_amd64 build, and a source build needs MSVC — it bricked every Windows
# bootstrap without build tools (Sentry RUST-65/66). The memory vector
# backend AUTO-prefers sqlite-vec (win_amd64 wheel, pinned below); hnswlib is
# an unreachable fallback. Re-add only alongside a vendored win_amd64 wheel.
#
# Generated on macOS 2026-08-03 as a platform-neutral full-stack resolution;
# to be re-validated on a real Windows x86_64 host before the experimental tier
# is promoted (see docs/superpowers/plans/2026-08-03-windows-support.md Task 1.3
# and the test-windows CI job).
#
# Below: `sys_platform == "win32"` conditional deps excluded from this lock's
# macOS-side resolution. `pip install --no-deps` skips dependency resolution
# entirely, so these must be listed explicitly or click/tqdm/loguru silently
# lose their Windows console-color and file-mtime support at runtime. Pins
# are best-effort (not resolved on a real Windows host); replace with the
# real resolution before this tier is promoted.
