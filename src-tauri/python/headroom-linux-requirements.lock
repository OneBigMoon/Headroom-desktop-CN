# Linux bootstrap runtime for Headroom desktop.
# This intentionally excludes optional memory/ML extras from headroom-ai[all]
# because packages such as hnswlib do not ship broadly compatible Linux wheels
# and cause bootstrap to fail on fresh machines.
#
# Versions kept in sync with headroom-requirements.lock where the package
# overlaps. 0.32.0 adds two new hard deps to headroom-ai's core/proxy
# requires_dist that this subset installs -- tomlkit (core) and orjson (proxy) --
# so both are added here too (leaf packages, no transitive deps). 0.33.0 raises
# the proxy extra's mcp floor to >=1.28.1,<2.0.0 (upstream #2642: mcp 2.x
# crashes the MCP server at startup), so mcp moves 1.27.1 -> 1.28.1 here to
# match the macOS lock. 0.35.0's core requires_dist adds pyyaml, which this
# subset had never carried: the headroom-ai wheel installs with --no-deps, so a
# core dep missing here is a hard ImportError at backend start, not a soft
# resolve that pip can fix. On every HEADROOM_PINNED_VERSION bump, re-check this
# file against https://pypi.org/pypi/headroom-ai/<version>/json (core plus the
# proxy extra), the way the macOS and Windows locks already are.
